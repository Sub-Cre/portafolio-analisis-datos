name: CI

on:
  push:
  pull_request:

jobs:
  proyectos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 03 - pruebas de limpieza
        run: pytest 03-limpieza-base-clientes/tests -q

      - name: Ejecutar todos los proyectos de punta a punta
        run: |
          cd 01-dashboard-ventas-retail && python src/generar_datos.py && python src/analisis.py && cd ..
          cd 02-reporte-financiero-automatizado && python src/generar_datos.py && python src/generar_reporte.py && cd ..
          cd 03-limpieza-base-clientes && python src/generar_datos.py && python src/pipeline.py && cd ..
          cd 04-analisis-sql-ecommerce && python src/generar_datos.py && python src/ejecutar_consultas.py && cd ..
          cd 05-prediccion-abandono-clientes && python src/generar_datos.py && python src/modelo.py && cd ..
          cd 06-mercado-inmobiliario && python src/analisis.py
